{% extends 'layout.html' %}

{% block content %}
<div class="about-section text-center">
  <h1 style="color: #9B287B; font-size: 2.5rem; font-weight: bold;">Fitness Classes</h1>
  <p style="font-size: 1.2rem; color: #555;">Find the perfect fitness class to achieve your goals and maintain a healthy lifestyle.</p>
</div>

<div class="container my-5">
  <div class="row g-4 justify-content-center">
    {% for class in classes %}
    <div class="col-md-4">
      <div class="card shadow-sm">
        <!-- Adjusted image size -->
        <img src="/static/images/{{ class[2] }}" class="card-img-top img-fluid" alt="{{ class[0] }}" style="max-height: 300px; object-fit: cover;">
        <div class="card-body text-center" style="background-color: #f8f9fa;">
          <!-- Highlighted class name -->
          <h5 class="card-title" style="font-size: 1.6rem; color: #772063; font-weight: bold;">{{ class[0] }}</h5>
          <!-- Improved description -->
          <p class="card-subtitle text-muted" style="font-size: 1.2rem; margin-bottom: 10px;">{{ class[1] }}</p>
          <button class="btn btn-primary" style="background-color: #772063; border: none;">Join Now</button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
