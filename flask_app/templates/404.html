{% extends "layout.html" %}

{% block content %}
<div class="text-center" style="padding:50px;">
    <h1 style="font-size: 5em;">404</h1>
    <h2>Oops! We can't find that page.</h2>
    <p>The page you were looking for (<strong>{{ request.path }}</strong>) doesn't exist or has been moved.</p>

    <div style="margin-top: 30px;">
        <a href="{{ url_for('home') }}" class="btn btn-primary">Back to Home</a>
    </div>
</div>
{% endblock %}
